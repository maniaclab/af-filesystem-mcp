apiVersion: v2
name: af-filesystem-mcp
description: |
  MCP server for per-user, impersonated filesystem access on the AF platform:
  browse and read your own NFS home (/home/<you>) and Ceph data area
  (/data/<you>) from an LLM session. Read-only in v1 -- there is no write
  tool. HTTP transport is broker-only (AF credential broker, per-user
  identity JWTs); there is no shared-secret mode, since a single shared
  identity would defeat the entire point of per-user impersonation.
type: application
version: 0.2.0
appVersion: "0.2.0"
keywords:
  - filesystem
  - mcp
  - af
  - analysis-facility
home: https://github.com/maniaclab/af-filesystem-mcp
sources:
  - https://github.com/maniaclab/af-filesystem-mcp
maintainers:
  - name: Giordon Stark
    email: kratsg@gmail.com
